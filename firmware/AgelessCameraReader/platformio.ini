[platformio]
src_dir = .

[env:esp32cam]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@7.4.2
lib_extra_dirs = ../libraries
build_src_filter = +<*.ino> +<*.cpp> -<lib/> -<tests/>
build_flags = -DBOARD_HAS_PSRAM -mfix-esp32-psram-cache-issue
